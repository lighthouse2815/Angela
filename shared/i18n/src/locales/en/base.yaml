  enabled: Enable companion memory and follow-ups
  memory-disabled: Enable Long-Term Memory to use companion context and follow-ups.
  kind: Record type
  subject: Your preference, subject, or activity goal
  follow-up: Ask again after
  no-timer: No follow-up
  minutes: '{count} minutes'
  save: Save / start activity
  complete: I finished this
  dismiss: Stop asking
  forget: Delete record
  error: Could not save the change. Check storage and the 50-record limit for this character.
  kinds:
    preference: Support preference
    thread: Unfinished subject
    activity: Shared activity
  status:
    open: Open
    completed: Completed (your report)
    dismissed: Dismissed
  prompt: 'Want to revisit this? {subject}'
  elapsed: 'Our activity time has elapsed: {subject}. How did it go?'
