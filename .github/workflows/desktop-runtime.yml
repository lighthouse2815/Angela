name: Angela desktop runtime

# Run manually to preserve the GitHub Actions quota.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      pnpm_config_verify_deps_before_run: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: pnpm
      - name: Install locked desktop dependencies
        run: pnpm --filter @angela/desktop... install --frozen-lockfile --ignore-scripts
      - name: Build desktop prerequisites sequentially
        run: pnpm --filter '@angela/desktop^...' --workspace-concurrency=1 run build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Shared companion runtime tests
        run: pnpm -F @angela/companion exec vitest run --config vitest.config.ts src/companion src/runtime --maxWorkers=1 --no-file-parallelism --testTimeout=30000 --hookTimeout=30000
      - name: Desktop Node tests
        run: pnpm exec vitest run --project stage-tamagotchi:node --testTimeout=30000 --hookTimeout=30000
      - name: Desktop companion browser tests
        run: pnpm -F @angela/desktop exec vitest run --config vitest.config.ts --project browser src/renderer/composables/use-companion-runtime.browser.test.ts src/renderer/composables/use-companion-follow-ups.browser.test.ts --maxWorkers=1 --no-file-parallelism --testTimeout=30000 --hookTimeout=30000
      - name: CLI typecheck
        run: pnpm -F @angela/cli typecheck
      - name: Desktop typecheck
        run: pnpm -F @angela/desktop typecheck
      - name: Desktop lint
        run: pnpm -F @angela/desktop lint
      - name: Desktop build
        run: pnpm -F @angela/desktop build
