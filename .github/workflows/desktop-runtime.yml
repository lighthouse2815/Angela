name: Angela desktop runtime

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'integrations/plugins/web-extension/**'
      - 'core/**'
      - 'providers/inference/**'
      - 'capabilities/**'
      - 'shared/**'
      - 'backend/contracts/**'
      - 'backend/channel/runtime/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - 'vitest.config.ts'
      - 'eslint.config.ts'
      - '.github/workflows/desktop-runtime.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'integrations/plugins/web-extension/**'
      - 'core/**'
      - 'providers/inference/**'
      - 'capabilities/**'
      - 'shared/**'
      - 'backend/contracts/**'
      - 'backend/channel/runtime/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - 'vitest.config.ts'
      - 'eslint.config.ts'
      - '.github/workflows/desktop-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: pnpm
      - name: Install locked desktop and CLI dependencies
        run: pnpm --filter @angela/desktop... --filter @angela/cli... --filter @angela/plugin-web-extension... install --frozen-lockfile --ignore-scripts
      # CLI typecheck needs its dependency declarations. The gateway engine has no TypeScript build output.
      - name: Build desktop and CLI typecheck prerequisites
        run: pnpm --filter '@angela/desktop^...' --filter '@angela/cli^...' --filter '!@angela/gateway' --workspace-concurrency=1 run build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Shared companion runtime tests
        run: pnpm -F @angela/companion exec vitest run --config vitest.config.ts src/companion src/runtime src/internet.test.ts src/internet --maxWorkers=1 --no-file-parallelism --testTimeout=30000 --hookTimeout=30000
      - name: Desktop Node tests
        run: pnpm exec vitest run --config apps/desktop/vitest.node.config.ts --testTimeout=30000 --hookTimeout=30000
      - name: Desktop companion browser tests
        run: pnpm -F @angela/desktop exec vitest run --config vitest.config.ts --project browser src/renderer/composables/use-companion-runtime.browser.test.ts src/renderer/composables/use-companion-follow-ups.browser.test.ts src/renderer/pages/settings/study-along/index.browser.test.ts --maxWorkers=1 --no-file-parallelism --testTimeout=30000 --hookTimeout=30000
      - name: CLI typecheck
        run: pnpm -F @angela/cli typecheck
      - name: Desktop typecheck
        run: pnpm -F @angela/desktop typecheck
      - name: Overlay smoke script typecheck
        run: pnpm exec tsc --ignoreConfig --noEmit --strict --skipLibCheck --target ESNext --module ESNext --moduleResolution Bundler --types node apps/desktop/scripts/desktop-overlay-live-window-smoke.ts apps/desktop/scripts/linux-window-render-smoke.ts
      - name: Desktop lint
        run: pnpm -F @angela/desktop lint
      - name: Restricted Study Along extension build
        run: pnpm -F @angela/plugin-web-extension build:study-along
      - name: Desktop build
        run: pnpm -F @angela/desktop build
      - name: Configure Electron sandbox helper
        working-directory: apps/desktop
        run: |
          pnpm exec install-electron
          sandbox_path="$(node -p "require('node:path').join(require('node:path').dirname(require('electron')), 'chrome-sandbox')")"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
      - name: Linux window render smoke
        timeout-minutes: 5
        env:
          SMOKE_REPORT_DIR: artifacts/linux-window-render
          SMOKE_EXPECT_OZONE_PLATFORM: x11
        run: xvfb-run -a pnpm -F @angela/desktop smoke:linux-window-render
