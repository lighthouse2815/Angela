name: Angela CLI core

on:
  push:
    branches: [main]
    paths:
      - 'apps/cli/**'
      - 'core/**'
      - 'providers/**'
      - 'capabilities/voice/**'
      - 'capabilities/vision/client/**'
      - 'capabilities/computer-use/**'
      - 'integrations/telegram/**'
      - 'integrations/zalo/**'
      - 'integrations/discord/**'
      - 'shared/**'
      - 'scripts/**'
      - 'vitest.config.ts'
      - 'eslint.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - '.github/workflows/cli-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/cli/**'
      - 'core/**'
      - 'providers/**'
      - 'capabilities/voice/**'
      - 'capabilities/vision/client/**'
      - 'capabilities/computer-use/**'
      - 'integrations/telegram/**'
      - 'integrations/zalo/**'
      - 'integrations/discord/**'
      - 'shared/**'
      - 'scripts/**'
      - 'vitest.config.ts'
      - 'eslint.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - '.github/workflows/cli-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: pnpm
      # The root postinstall builds the full monorepo. Build only CLI prerequisites below.
      - name: Install locked CLI dependencies
        run: pnpm --filter @angela/cli... install --frozen-lockfile --ignore-scripts
      - name: Build CLI prerequisites sequentially
        run: pnpm --filter '@angela/cli^...' --workspace-concurrency=1 run build
      - name: CLI build
        run: pnpm -F @angela/cli build
      - name: Gateway regression tests
        working-directory: providers/gateway/vendor
        run: node ../../../node_modules/vitest/vitest.mjs run --config tests/vitest.config.js tests/unit/gateway-endpoint.test.js tests/unit/codex-settings-refresh.test.js tests/unit/openai-to-commandcode.test.js tests/unit/windsurf-executor.test.js tests/unit/kimchi.test.js tests/unit/kimchi-strip-reasoning.test.js tests/unit/cline-auth.test.js --maxWorkers=1
      - name: CLI tests
        run: pnpm -r --workspace-concurrency=1 --filter @angela/cli --filter @angela/companion --filter @angela/telegram --filter @angela/zalo --filter @angela/voice-client --filter @angela/vision --filter @angela/host-sdk --filter @angela/discord-companion exec vitest run --config vitest.config.ts --maxWorkers=1 --testTimeout=30000 --hookTimeout=30000
      - name: CLI typecheck
        run: pnpm -F @angela/cli typecheck
      - name: CLI lint
        run: pnpm exec eslint apps/cli/src apps/cli/scripts core/companion/src shared/sdk/companion-host/src capabilities/voice/client/src capabilities/vision/client/src integrations/telegram/src integrations/zalo/src integrations/discord/runtime/src
      - name: Built CLI smoke check
        run: node apps/cli/dist/bin/run.mjs --help
