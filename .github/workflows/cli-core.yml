name: Angela CLI core

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      pnpm_config_verify_deps_before_run: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: pnpm
      # The root postinstall builds the full monorepo. Build only CLI prerequisites below.
      - name: Install locked CLI dependencies
        run: pnpm --filter @angela/cli... install --frozen-lockfile --ignore-scripts
      - name: Build CLI prerequisites sequentially
        run: pnpm --filter '@angela/cli^...' --workspace-concurrency=1 run build
      - name: CLI tests
        run: pnpm -F @angela/cli exec vitest run --config vitest.config.ts --maxWorkers=1 --testTimeout=30000 --hookTimeout=30000
      - name: CLI typecheck
        run: pnpm -F @angela/cli typecheck
      - name: CLI build
        run: pnpm -F @angela/cli build
      - name: CLI lint
        run: pnpm exec eslint packages/airi-cli/src packages/airi-cli/scripts
      - name: Built CLI smoke check
        run: node packages/airi-cli/dist/bin/run.mjs --help
